spring.application.name=HotelReservationSystem
server.port=3000

# Perfil por defecto: dev (H2 en memoria + datos semilla). Para PostgreSQL usar SPRING_PROFILES_ACTIVE=postgres
spring.profiles.default=dev

# JWT: en produccion definir JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-hotel-mn-2026-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuracion JPA/Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Loggers
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
