spring.application.name=HotelReservationSystem
server.port=3000

# Perfil por defecto: dev (H2 en memoria). Para PostgreSQL usar SPRING_PROFILES_ACTIVE=postgres (ver docker-compose.yml)
spring.profiles.default=dev

# Configuracion JPA/Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (HU-04): secreto en Base64 de al menos 32 bytes. Sin valor por defecto: en produccion la app NO arranca sin JWT_SECRET.
#   Generar con: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: origenes del frontend separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Hotel: zona horaria (todas las fechas se calculan con un Clock en esta zona) y reglas de reserva (ADR-006)
app.time-zone=America/Panama
app.reservation.check-in-time=15:00
app.reservation.max-nights=30
