# Desarrollo local sin dependencias externas: H2 en memoria en modo compatible con PostgreSQL
spring.datasource.url=jdbc:h2:mem:hoteldb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
